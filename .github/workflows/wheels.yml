name: Wheels

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade build twine
      - run: python -m build --sdist --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webai-provider-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  wheels:
    name: Wheels · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-15
            target: macos-arm64
          - runner: windows-latest
            target: windows-x86_64
    env:
      CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
      CIBW_ARCHS: auto64
      CIBW_TEST_COMMAND: >-
        python -I -c "from webaiprovider.providers.chatgpt.sentinel import proof; assert proof._native is not None"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test platform wheels
        run: pipx run cibuildwheel==4.3.5 --output-dir wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webai-provider-${{ matrix.target }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
