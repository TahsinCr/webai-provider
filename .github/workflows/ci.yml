name: Checks

on:
  workflow_call:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -t . -p 'test_*.py' -v

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build --sdist --wheel
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -m pip check
      - name: Prepare isolated test sources
        run: |
          mkdir -p "$RUNNER_TEMP/package-tests"
          cp -R tests "$RUNNER_TEMP/package-tests/tests"
          cp run_tests.py run_live_tests.py "$RUNNER_TEMP/package-tests/"
      - name: Test installed wheel
        working-directory: ${{ runner.temp }}/package-tests
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -v
      - name: Verify installed wheel metadata and typing marker
        run: >-
          python -I -c
          "import importlib.metadata as m, importlib.resources as r, importlib.util as u, webaiprovider;
          assert m.version('webai-provider') == webaiprovider.__version__;
          assert u.find_spec('webai_provider') is None;
          assert r.files('webaiprovider').joinpath('py.typed').is_file()"
      - run: python -m pip install --force-reinstall --no-deps dist/*.tar.gz
      - name: Test installed source distribution
        working-directory: ${{ runner.temp }}/package-tests
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -v
      - name: Verify installed source distribution metadata and typing marker
        run: >-
          python -I -c
          "import importlib.metadata as m, importlib.resources as r, importlib.util as u, webaiprovider;
          assert m.version('webai-provider') == webaiprovider.__version__;
          assert u.find_spec('webai_provider') is None;
          assert r.files('webaiprovider').joinpath('py.typed').is_file()"
