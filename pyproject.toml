[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webai-provider"
version = "1.3.0b0"
description = "Independent Python clients for ChatGPT, Gemini, Claude and Grok web sessions"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT"]
readme = "README.md"
authors = [{name = "TahsinCr"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.27,<1",
    "websocket-client>=1.8,<2",
    "browser-cookie3>=0.20.1,<0.21",
    "lz4>=4.4.5,<5",
    "curl-cffi>=0.16,<1",
    "flowevent>=1.3,<2",
]

[project.urls]
Repository = "https://github.com/TahsinCr/webai-provider"
Changelog = "https://github.com/TahsinCr/webai-provider/blob/v1.3-beta/CHANGELOG.md"
Issues = "https://github.com/TahsinCr/webai-provider/issues"

[project.optional-dependencies]
dev = ["build>=1,<2", "ruff>=0.11,<1", "twine>=6,<7"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["webai_provider"]

[tool.setuptools.packages.find]
where = ["."]
include = ["webai_provider*"]
